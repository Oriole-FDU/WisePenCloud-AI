[project]
name = "wisepen-server-py"
version = "0.1.0"
description = "WisePen Python Microservices Monorepo"
requires-python = ">=3.9"
dependencies = [
    "litellm>=1.81.3",
    "wisepen-chat-service",
    "wisepen-mcp-service",
    "wisepen-common",
    "wisepen-sandbox-v1-service",
    "mcp>=1.27,<2",
    "pytest>=9.1.1",
]

[tool.uv.workspace]
members = [
    "services/wisepen-chat-service",
    "services/wisepen-common",
    "services/wisepen-mcp-service",
    "services/wisepen-sandbox-v1-service",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
wisepen-chat-service = { workspace = true }
wisepen-mcp-service = { workspace = true }
wisepen-common = { workspace = true }
wisepen-sandbox-v1-service = { workspace = true }
