services:
  chat-service:
    ports:
      - "9200:9200"
    volumes:
      - ./services/wisepen-chat-service/src:/app/services/wisepen-chat-service/src
      - ./services/wisepen-chat-service/pyproject.toml:/app/services/wisepen-chat-service/pyproject.toml:ro
      - ./services/wisepen-common/src:/app/services/wisepen-common/src
      - ./services/wisepen-common/pyproject.toml:/app/services/wisepen-common/pyproject.toml:ro
    command:
      - uvicorn
      - chat.main:app
      - --host
      - 0.0.0.0
      - --port
      - "9200"
      - --reload
      - --reload-dir
      - /app/services/wisepen-chat-service/src
      - --reload-dir
      - /app/services/wisepen-common/src
