[project]
name = "wisepen-common"
version = "0.1.0"
description = "WisePen Common Library for Python Microservices"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jiazheng Sun", email = "jzsun24@m.fudan.edu.cn" }
]
dependencies = [
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic-settings",
    "loguru",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-instrumentation-aiokafka",
    "aiokafka",
    "httpx",
    "nacos-sdk-python",
    "langchain-text-splitters>=1.0,<2",
    "markdown-it-py>=4,<5",
    "mdit-py-plugins>=0.5,<1",
    "bm25s>=0.3.9",
    "jieba>=0.42.1",
    "numpy>=2.4.6",
    "thulac>=0.2.2",
    "zeroentropy",
]
