# Nacos Data ID: wisepen-scholar-service-dev.yaml
# Replace placeholders through the existing Nacos secret configuration channel.
FROM_SOURCE_SECRET: "<shared internal source secret>"
ELASTICSEARCH_URIS:
  - "http://wisepen-dev-server:9200"
ELASTICSEARCH_USERNAME: "<username>"
ELASTICSEARCH_PASSWORD: "<password>"
QDRANT_URL: "http://wisepen-dev-server:6333"
QDRANT_API_KEY: "<Qdrant API key>"
REDIS_URL: "redis://:<password>@wisepen-dev-server:6379/1"
S2_API_KEY: "<platform Semantic Scholar API key>"
# Optional; set only through the existing Nacos secret channel when HF is used.
HF_TOKEN: null
OPENALEX_API_KEY: null
SCHOLAR_EMBEDDING_TIMEOUT_SECONDS: 2
SCHOLAR_EMBEDDING_CPU_THREADS: 2
SCHOLAR_EMBEDDING_MODELS_PATH: null
SCHOLAR_EMBEDDING_GPU_PYTHON: "D:/Rag/.venv/Scripts/python.exe"
SCHOLAR_INDEX_ALIAS: "wisepen-scholar-arxiv"
# 策略完整放在 Nacos；列表顺序即优先级，发布后由各实例自动更新。
# CS 改为 HF 优先时，将 searchers 调整为 [huggingface, arxiv]。
SCHOLAR_POLICIES:
  common_enrichers: [arxiv, s2, openalex]
  fields:
    general:
      searchers: [openalex, arxiv]
    computer_science:
      searchers: [arxiv, huggingface]
      field_enrichers: [huggingface]
      discoverer: huggingface
    medicine:
      searchers: [openalex]
    biology:
      searchers: [openalex, arxiv]
    engineering:
      searchers: [openalex, arxiv]
    economics_business:
      searchers: [openalex, arxiv]
    mathematics:
      searchers: [arxiv, openalex]
    physics:
      searchers: [arxiv, openalex]
    chemistry:
      searchers: [openalex, arxiv]
    psychology:
      searchers: [openalex]
    social_sciences:
      searchers: [openalex, arxiv]
    arts_humanities:
      searchers: [openalex]
    law:
      searchers: [openalex]
    materials_environmental_sciences:
      searchers: [openalex, arxiv]
# 两路召回各取 SEARCH_CANDIDATES；NUM_CANDIDATES 不小于它。
SCHOLAR_SEARCH_CANDIDATES: 200
SCHOLAR_SEARCH_NUM_CANDIDATES: 1000
SCHOLAR_SEARCH_RRF_K: 60
SCHOLAR_SEARCH_CITATION_WEIGHT: 0.20
SCHOLAR_SEARCH_INFLUENTIAL_WEIGHT: 0.10
SCHOLAR_QUERY_CACHE_TTL_SECONDS: 600
SCHOLAR_DISCOVERY_CACHE_TTL_SECONDS: 900
SCHOLAR_PAPER_CACHE_TTL_SECONDS: 86400
SCHOLAR_NEGATIVE_CACHE_TTL_SECONDS: 3600
SCHOLAR_HF_CONCURRENCY: 4
# Online admission counts pending upstream batches; calls may share a batch.
SCHOLAR_S2_MAX_QUEUED_AHEAD: 3
SCHOLAR_S2_NOKEY_INTERVAL_SECONDS: 1.5
SCHOLAR_S2_KEY_INTERVAL_SECONDS: 1.5
SCHOLAR_S2_BATCH_MAX_IDS: 300
SCHOLAR_REQUEST_TIMEOUT_SECONDS: 25
SCHOLAR_ETL_REQUEST_TIMEOUT_SECONDS: 120
UNPAYWALL_EMAIL: "jzsun24@m.fudan.edu.cn"
