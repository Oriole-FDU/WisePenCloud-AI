# Nacos Data ID: wisepen-scholar-service-dev.yaml
# Replace placeholders through the existing Nacos secret configuration channel.
FROM_SOURCE_SECRET: "<shared internal source secret>"
ELASTICSEARCH_URIS:
  - "http://wisepen-dev-server:9200"
ELASTICSEARCH_USERNAME: "<username>"
ELASTICSEARCH_PASSWORD: "<password>"
REDIS_URL: "redis://:<password>@wisepen-dev-server:6379/1"
S2_API_KEY: "<platform Semantic Scholar API key>"
# Optional; set only through the existing Nacos secret channel when HF is used.
HF_TOKEN: null
SCHOLAR_INDEX_ALIAS: "wisepen-scholar-arxiv"
SCHOLAR_QUERY_CACHE_TTL_SECONDS: 600
SCHOLAR_DISCOVERY_CACHE_TTL_SECONDS: 900
SCHOLAR_PAPER_CACHE_TTL_SECONDS: 86400
SCHOLAR_NEGATIVE_CACHE_TTL_SECONDS: 3600
SCHOLAR_HF_CONCURRENCY: 4
# Online skips S2 only when waiting tasks ahead exceed this number. Offline has no threshold.
SCHOLAR_S2_MAX_QUEUED_AHEAD: 5
SCHOLAR_REQUEST_TIMEOUT_SECONDS: 25
SCHOLAR_ETL_REQUEST_TIMEOUT_SECONDS: 120
