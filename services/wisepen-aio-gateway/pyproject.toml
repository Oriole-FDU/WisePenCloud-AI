[project]
name = "wisepen-aio-gateway"
version = "0.1.0"
description = "WisePen AIO Gateway: Sidecar proxy for AIO Sandbox multi-tenant access"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pyyaml",
    "pydantic>=2.0",
    "pydantic-settings",
    "uvicorn[standard]",
    "httpx",
    "aiohttp",
    "nacos-sdk-python",
    "wisepen-common",
    "wisepen-sandbox-service",
]

[project.optional-dependencies]
dev = []

[tool.uv.sources]
wisepen-common = { workspace = true }
