[project]
name = "wisepen-rag"
version = "0.1.0"
description = "WisePen RAG V4"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.12,<1",
    "dependency-injector>=4.49,<5",
    "fastapi>=0.136,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pymongo>=4.17,<5",
    "pyyaml>=6,<7",
    "qdrant-client>=1.18,<2",
    "uvicorn>=0.34,<1",
    "wisepen-common",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "mongo_integration: requires an explicit RAG_TEST_MONGODB_URI and uses an isolated test database",
    "kafka_integration: requires RAG_TEST_KAFKA_BOOTSTRAP_SERVERS and uses isolated random test topics",
    "qdrant_integration: requires RAG_TEST_QDRANT_URL and uses isolated random test collections",
]

[tool.ruff]
target-version = "py311"
line-length = 88
