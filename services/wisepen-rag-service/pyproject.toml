[project]
name = "wisepen-rag-service"
version = "0.1.0"
description = "WisePen RAG service v2"
requires-python = ">=3.11"
dependencies = [
    "beanie>=2,<3",
    "aiokafka>=0.12,<1",
    "dependency-injector>=4.49,<5",
    "fastapi>=0.136,<1",
    "neo4j>=6.2,<7",
    "neo4j-graphrag==1.18.0",
    "openai",
    "pydantic",
    "pydantic-settings",
    "pymongo>=4.17.0",
    "pyyaml",
    "qdrant-client==1.18.0",
    "redis>=5,<9",
    "wisepen-common",
    "zeroentropy",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
