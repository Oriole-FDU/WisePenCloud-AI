# Local settings for the container-pool core.
FROM_SOURCE_SECRET: local-dev
MONGODB_URL: mongodb://localhost:27017
MONGODB_DB_NAME: wisepen_dev
SANDBOX_IMAGE: wisepen-aio:latest

SANDBOX_MAX_USER_BINDINGS: 20
SANDBOX_TARGET_READY: 2
SANDBOX_MIN_READY: 1
SANDBOX_READY_RESERVE: 0
SANDBOX_MAX_CREATE_BATCH: 2

SANDBOX_WARMUP_TIMEOUT_SECONDS: 60.0
SANDBOX_DESTROY_TIMEOUT_SECONDS: 30.0
SANDBOX_WARMUP_MAX_RETRIES: 3
SANDBOX_WARMUP_RETRY_BACKOFF_SECONDS: 5.0
SANDBOX_WARMUP_RETRY_MAX_BACKOFF_SECONDS: 60.0
SANDBOX_WATCHER_INTERVAL_SECONDS: 5.0

SANDBOX_WORKSPACE_ROOT: ./data/workspaces
SANDBOX_WORKSPACE_CACHE_ROOT: ./data/workspace-cache
SANDBOX_WORKSPACE_SNAPSHOT_TTL_SECONDS: 604800
SANDBOX_WORKSPACE_CACHE_MAX_BYTES: 0
SANDBOX_WORKSPACE_CACHE_HIGH_WATERMARK_RATIO: 0.8
SANDBOX_WORKSPACE_CACHE_TARGET_WATERMARK_RATIO: 0.7
SANDBOX_WORKSPACE_EVICTION_INTERVAL_SECONDS: 3600.0
