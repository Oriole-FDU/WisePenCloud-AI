[project]
name = "wisepen-sandbox-v1-service"
version = "0.1.0"
description = "Temporary WisePen Sandbox v1 core lifecycle service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "dependency_injector",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "pymongo",
    "pyyaml",
    "uvicorn[standard]",
    "wisepen-common",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]

[tool.uv.sources]
wisepen-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
