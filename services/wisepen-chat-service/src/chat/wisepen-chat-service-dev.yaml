# ============================================================
# Nacos 配置中心 - wisepen-chat-service-dev.yaml
# Data ID : wisepen-chat-service-dev.yaml
# Group   : DEFAULT_GROUP
# Namespace: public（根据实际 namespace 调整）
#
# 说明：此文件中的键名对应 Settings 类的字段名（大写），
#       Nacos 拉取后会覆盖本地 .env 的同名字段。
# ============================================================

# --- 服务基础 ---
APP_NAME: "WisePen Chat Service"
SERVICE_NAME: "wisepen-chat-service"
SERVICE_HOST: "0.0.0.0"     # 生产环境改为实际内网 IP 或 0.0.0.0
SERVICE_PORT: 8000
DEV: true

# --- LLM 统一网关 ---
LLM_BASE_URL: "https://api.zhizengzeng.com/v1"
LLM_API_KEY: "sk-your-production-key-here"

# --- 模型配置 ---
QUERY_MODEL: "openai/qwen3-4b"
EMBEDDING_MODEL: "openai/qwen3-embedding-8b"
EMBEDDING_DIMENSIONS: 1024

# --- Web Search 平台源（api key 在 .env 中配置，不写入 Nacos）---
WEB_SEARCH_FOURGET_BASE_URL: "http://127.0.0.1:8088"
WEB_SEARCH_EXA_BASE_URL: "https://api.exa.ai"
WEB_SEARCH_TAVILY_BASE_URL: "https://api.tavily.com"
WEB_SEARCH_ANYSEARCH_BASE_URL: "https://api.anysearch.com"
WEB_SEARCH_SERPER_BASE_URL: "https://google.serper.dev"
WEB_SEARCH_PLATFORM_EXA_ENABLED: false
WEB_SEARCH_PLATFORM_EXA_API_KEY: null

# --- 安全 ---
