[project]
name = "wisepen-chat-service"
version = "0.1.0"
description = "WisePen Chat Microservice: RAG & LLM Orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jiazheng Sun", email = "jzsun24@m.fudan.edu.cn" }
]
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
    "dependency_injector",
    "litellm",
    "mem0ai",
    "mcp>=1.27,<2",
    "openai",
    "anthropic",
    "google-genai",
    "dashscope",
    "orjson",
    "jsonschema",
    "beanie",
    "redis[asyncio]",
    "nacos-sdk-python",
    "pyyaml",
    "jieba",
    "thulac",
    "bm25s>=0.3.9",
    "numpy",
    "zeroentropy",
    "langchain-text-splitters>=1.0,<2",
    "markdown-it-py>=4,<5",
    "mdit-py-plugins>=0.5,<1",
    "wisepen-common",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
