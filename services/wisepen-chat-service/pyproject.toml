[project]
name = "wisepen-chat-service"
version = "0.1.0"
description = "WisePen Chat Microservice: RAG & LLM Orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jiazheng Sun", email = "jzsun24@m.fudan.edu.cn" }
]
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
    "dependency_injector",
    "litellm",
    "mem0ai",
    "neo4j==6.2.0",
    "neo4j-graphrag==1.18.0",
    "qdrant-client==1.18.0",
    "mcp>=1.27,<2",
    "openai",
    "anthropic",
    "google-genai",
    "dashscope",
    "orjson",
    "jsonschema",
    "beanie",
    "redis",
    "nacos-sdk-python",
    "pyyaml",
    "zeroentropy",
    "pymupdf",
    "magika",
    "regex",
    "wisepen-common",
    "httpx",
    "anyio",
    "dnspython",
    "scrapling[fetchers]",
    "trafilatura",
    "charset-normalizer",
    "lxml",
    "hishel[async]",
    "pdf-inspector>=0.2.5",
    "mineru==3.4.4",
    "beautifulsoup4",
    "markdownify",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
