[project]
name = "wisepen-sandbox-service"
version = "0.2.0"
description = "Platform-independent sandbox lifecycle and scheduling service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "dependency_injector",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "uvicorn[standard]",
    "mcp>=1.27,<2",
    "wisepen-common",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]
mongo = ["pymongo"]

[tool.uv.sources]
wisepen-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"