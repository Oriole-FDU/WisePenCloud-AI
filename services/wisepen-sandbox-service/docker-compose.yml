version: "3.8"

services:
  sandbox-manager:
    build:
      context: ../..
      dockerfile: services/wisepen-sandbox-service/Dockerfile
    container_name: wisepen-sandbox-manager
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-workspaces:/workspaces
    ports:
      - "8001:8001"
    environment:
      - PROFILE=dev
      - DOCKER_HOST=unix:///var/run/docker.sock
      - NACOS_SERVER_ADDR=127.0.0.1:8848
      - CHAT_USE_NACOS=0
      - SANDBOX_HOST=0.0.0.0
      - SANDBOX_QUEUE_ENABLE=1
      - WORKER_MIN_IDLE=2
      - WORKER_MAX_TOTAL=8
      - WORKER_DIRTY_TTL=60
      - WORKSPACE_CACHE_DIR=/workspaces
      - WORKER_IMAGE=ghcr.io/agent-infra/sandbox:latest
      - FROM_SOURCE_SECRET=local-dev-secret
    networks:
      - sandbox-net
    labels:
      - "wisepen.role=sandbox-manager"

volumes:
  sandbox-workspaces:

networks:
  sandbox-net:
    driver: bridge
    name: sandbox-net
