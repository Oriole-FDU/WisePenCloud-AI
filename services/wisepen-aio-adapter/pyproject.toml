[project]
name = "wisepen-aio-adapter"
version = "0.2.0"
description = "AIO implementation of the sandbox provider port"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic",
    "wisepen-sandbox-service",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]

[tool.uv.sources]
wisepen-sandbox-service = { workspace = true }
