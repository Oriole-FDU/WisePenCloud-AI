[project]
name = "wisepen-rag-service-v3"
version = "0.1.0"
description = "WisePen RAG service v3"
requires-python = ">=3.11"
dependencies = [
    "beanie>=2,<3",
    "dependency-injector>=4.49,<5",
    "fastapi>=0.136,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pymongo>=4.17,<5",
    "pyyaml",
    "uvicorn",
    "wisepen-common",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_v3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88
