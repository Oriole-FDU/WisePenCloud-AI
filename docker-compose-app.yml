version: '3.8'

services:
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: wisepen-chat-service
        SERVICE_PKG: chat
        SERVICE_PORT: "19904"
        SERVICE_PROJECT: wisepen-chat-service
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: ${DOCKER_REGISTRY}/wisepencloud-chat:${APP_VERSION}
    container_name: wisepen-chat-service
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PROFILE=prod
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE_ID=
      - NACOS_GROUP=DEFAULT_GROUP
      - NACOS_USERNAME=${NACOS_USERNAME}
      - NACOS_PASSWORD=${NACOS_PASSWORD}
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=19904
      - LOG_LEVEL=INFO
      - OTEL_SERVICE_NAME=wisepen-chat-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
    volumes:
      - ../logs/chat:/logs
    networks:
      wisepen-net:
        aliases:
          - chat-service

  mcp-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: wisepen-mcp-service
        SERVICE_PKG: wisepen_mcp
        SERVICE_PORT: "19911"
        SERVICE_PROJECT: wisepen-mcp-service
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: ${DOCKER_REGISTRY}/wisepencloud-mcp:${APP_VERSION}
    container_name: wisepen-mcp-service
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PROFILE=prod
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE_ID=
      - NACOS_GROUP=DEFAULT_GROUP
      - NACOS_USERNAME=${NACOS_USERNAME}
      - NACOS_PASSWORD=${NACOS_PASSWORD}
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=19911
      - LOG_LEVEL=INFO
      - OTEL_SERVICE_NAME=wisepen-mcp-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
    volumes:
      - ../logs/mcp:/logs
    networks:
      wisepen-net:
        aliases:
          - mcp-service

  sandbox-service:
    # 默认实验只启动 Chat/MCP；需要沙箱时显式启用该 profile。
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: wisepen-sandbox-service
        SERVICE_PKG: sandbox
        SERVICE_PORT: "19915"
        SERVICE_PROJECT: wisepen-sandbox-service
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: ${DOCKER_REGISTRY}/wisepencloud-sandbox:${APP_VERSION}
    container_name: wisepen-sandbox-service
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PROFILE=prod
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE_ID=
      - NACOS_GROUP=DEFAULT_GROUP
      - NACOS_USERNAME=${NACOS_USERNAME}
      - NACOS_PASSWORD=${NACOS_PASSWORD}
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=19915
      - LOG_LEVEL=INFO
      - SANDBOX_DOCKER_HOST=host.docker.internal
      - OTEL_SERVICE_NAME=wisepen-sandbox-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../logs/sandbox:/logs
      - ../data/sandbox/workspace-cache:/app/services/wisepen-sandbox-service/src/data/workspace-cache
    networks:
      wisepen-net:
        aliases:
          - sandbox-service

  scholar-service:
    profiles: ["scholar"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: wisepen-scholar-service
        SERVICE_PKG: scholar
        SERVICE_PORT: "19916"
        SERVICE_PROJECT: wisepen-scholar-service
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    image: ${DOCKER_REGISTRY}/wisepencloud-scholar:${APP_VERSION}
    container_name: wisepen-scholar-service
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PROFILE=prod
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_NAMESPACE_ID=
      - NACOS_GROUP=DEFAULT_GROUP
      - NACOS_USERNAME=${NACOS_USERNAME}
      - NACOS_PASSWORD=${NACOS_PASSWORD}
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=19916
      - LOG_LEVEL=INFO
      - OTEL_SERVICE_NAME=wisepen-scholar-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
    volumes:
      - ../logs/scholar:/logs
      # 独立 ETL 容器复用同一目录；HTTP 服务只通过 ES/Redis 读取。
      - ../data/scholar:/app/services/wisepen-scholar-service/.runtime
    networks:
      wisepen-net:
        aliases:
          - scholar-service

networks:
  wisepen-net:
    external: true
    name: wisepen-net
